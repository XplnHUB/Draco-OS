[workspace]
members = [
    "draco_core",
    "draco_ipc",
    "draco_face",
    "draco_shell",
    "draco_system",
    "draco_vision",
    "draco_voice",
    "draco_intent",
    "draco_executor",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
clap = { version = "4", features = ["derive"] }
